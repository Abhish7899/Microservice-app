server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for Kubernetes liveness & readiness probes
    location = /frontend-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ensure index.html is never cached so users receive fresh UI immediately after deployment
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Serve static assets or fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression for fast static asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
