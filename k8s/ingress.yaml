apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: prod
  labels:
    app.kubernetes.io/name: microservices-ingress
    app.kubernetes.io/part-of: microservices-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/tasks
            pathType: Prefix
            backend:
              service:
                name: task-service
                port:
                  number: 3000
          - path: /tasks
            pathType: Prefix
            backend:
              service:
                name: task-service
                port:
                  number: 3000
          - path: /api/stats
            pathType: Prefix
            backend:
              service:
                name: stats-service
                port:
                  number: 4000
          - path: /stats
            pathType: Prefix
            backend:
              service:
                name: stats-service
                port:
                  number: 4000
