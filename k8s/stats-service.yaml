apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
  namespace: prod
  labels:
    app: stats-service
    tier: backend
    app.kubernetes.io/name: stats-service
    app.kubernetes.io/part-of: microservices-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: stats-service
  template:
    metadata:
      labels:
        app: stats-service
        tier: backend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: stats-service
          image: STATS_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: STATS_SERVICE_PORT
            - name: TASK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TASK_SERVICE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---
apiVersion: v1
kind: Service
metadata:
  name: stats-service
  namespace: prod
  labels:
    app: stats-service
    tier: backend
    app.kubernetes.io/name: stats-service
    app.kubernetes.io/part-of: microservices-app
spec:
  type: ClusterIP
  selector:
    app: stats-service
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stats-service-hpa
  namespace: prod
  labels:
    app: stats-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stats-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stats-service-pdb
  namespace: prod
  labels:
    app: stats-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stats-service
