apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: prod
  labels:
    app: frontend-service
    tier: frontend
    app.kubernetes.io/name: frontend-service
    app.kubernetes.io/part-of: microservices-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
        tier: frontend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend-service
          image: FRONTEND_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /frontend-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /frontend-health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: prod
  labels:
    app: frontend-service
    tier: frontend
    app.kubernetes.io/name: frontend-service
    app.kubernetes.io/part-of: microservices-app
spec:
  type: ClusterIP
  selector:
    app: frontend-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-service-hpa
  namespace: prod
  labels:
    app: frontend-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-service-pdb
  namespace: prod
  labels:
    app: frontend-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend-service
